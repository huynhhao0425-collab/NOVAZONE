<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novazone - Login</title>
    <link rel="stylesheet" href="/NOVAZONE-SPCK/CSS/Login-style.css">
</head>

<body>

    <h1 class="Logo">NOVAZONE</h1>

    <div class="Login-box">

        <div class="left">
            <img src="/NOVAZONE-SPCK/images/Logo_2.png" alt="Logo" width="370px">
        </div>

        <div class="right">
            <form action="">
                <h2>Login</h2>
                <input type="email" placeholder="Email">
                <input type="password" placeholder="Password">

                <button>Login</button>

                <p>Đã có tài khoản?
                    <a href="Register.html">Register</a>
                </p>
            </form>

        </div>

    </div>

    <footer>
        <p>&copy; 2026 Novazone. All rights reserved.</p>
    </footer>
    
</body>

</html>

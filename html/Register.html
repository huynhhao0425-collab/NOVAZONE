<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Novazone - Register</title>
    <link rel="stylesheet" href="/CSS/Register-style.css">
</head>

<body>

    <h1 class="Logo">NOVAZONE</h1>

    <div class="register-box">

        <div class="left">
            <img src="/images/Logo.png" alt="Logo" width="370px">
        </div>

        <div class="right">

            <form action="" id="register-form">

                <h2>Register</h2>

                <input required name="EMAIL" type="email" placeholder="Email">
                <input required name="PASSWORD" type="password" placeholder="Password">
                <input required name="RE_PASSWORD" type="password" placeholder="Re-password">
                <input required name="USERNAME" type="text" placeholder="Username">

                <button>Register</button>

                <p>Đã có tài khoản?
                    <a href="Login.html">Login</a>
                </p>
            </form>


        </div>

    </div>

    <footer>
        <p>&copy; 2026 Novazone. All rights reserved.</p>
    </footer>
    

    <script src="/js/register.js">

    </script>
</body>

</html>
